<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://use.typekit.net/gac6jnd.css">
  <title>The Dot · Editorial Reel Studio</title>
  <style>
    :root{--cream:#faf9f6;--ink:#35332f;--graphite:#47453f;--grey:#7a776f;--yellow:#daff00;--line:#b7b4ac}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:ff-real-text-pro,serif;background:var(--cream);color:var(--ink)}
    .reel{position:relative;width:1080px;height:1920px;background:var(--cream);overflow:hidden;isolation:isolate}
    .reel.dark{background:var(--ink);color:var(--cream)}
    .reel:before{content:"";position:absolute;inset:0;opacity:.13;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.62' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.26' d='M0 0h240v240H0z'/%3E%3C/svg%3E");mix-blend-mode:multiply;z-index:20}
    .safe{position:absolute;left:104px;right:104px;top:300px;bottom:465px}
    .mast{height:62px;border-top:2px solid currentColor;display:flex;align-items:center;justify-content:space-between;font:600 23px/1 futura-pt,Futura,sans-serif;letter-spacing:.18em;text-transform:uppercase}
    .mast span:nth-child(2){font-weight:300;letter-spacing:.12em}
    .meta{display:flex;justify-content:space-between;align-items:center;position:absolute;bottom:0;left:0;right:0;padding-top:22px;border-top:1px solid currentColor;font:600 22px/1.2 futura-pt,Futura,sans-serif;letter-spacing:.16em;text-transform:uppercase}
    h1,h2,p{margin:0}h1,h2{font-family:futura-pt,Futura,sans-serif;text-transform:uppercase;letter-spacing:-.045em}
    .eyebrow{font:600 25px/1.3 futura-pt,Futura,sans-serif;letter-spacing:.18em;text-transform:uppercase}
    .main{position:absolute;top:155px;bottom:80px;left:0;right:0}
    .hero{font-size:118px;line-height:.98;font-weight:700;max-width:910px}
    .hero.tight{font-size:102px}.hero.large{font-size:137px}
    .sub{font:400 40px/1.27 ff-real-text-pro,Arial,sans-serif;max-width:840px;margin-top:55px}
    .small{font:400 29px/1.32 ff-real-text-pro,Arial,sans-serif}
    .marker{position:relative;white-space:nowrap}.marker:after{content:"";position:absolute;left:0;right:0;bottom:-.06em;height:.09em;background:linear-gradient(90deg,var(--yellow),rgba(218,255,0,.25));transform:rotate(-1deg);z-index:-1}
    .orb{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 4%,#b0afa9 38%,#4a4944 69%,#faf9f6 75%);filter:grayscale(1);opacity:.72;right:-30px;bottom:125px;box-shadow:inset -8px -10px 25px #35332f33}
    .orb.yellow{width:230px;height:230px;opacity:.7;background:radial-gradient(circle,#daff00cc,#faf9f6 72%)}
    .dark .orb{opacity:.23}
    .dotgrid{position:absolute;right:0;bottom:148px;display:grid;grid-template-columns:repeat(6,30px);gap:26px;opacity:.77}
    .dotgrid i{width:30px;height:30px;border:2px solid currentColor;border-radius:50%}.dotgrid i:nth-child(4n){background:currentColor}.dotgrid i:nth-child(11){background:radial-gradient(circle,#daff00cc,#faf9f6);border:0}
    .rule{height:2px;background:currentColor;opacity:.62;margin:42px 0}
    .note{position:absolute;bottom:225px;left:0;max-width:700px;font:400 36px/1.27 ff-real-text-pro,Arial,sans-serif}
    .source{font:600 22px/1.3 futura-pt,Futura,sans-serif;text-transform:uppercase;letter-spacing:.12em;margin-top:35px;opacity:.72}
    .form{margin-top:110px;width:780px;background:#fffefc;color:var(--ink);border:2px solid var(--ink);box-shadow:18px 18px 0 #35332f16;padding:36px;transform:rotate(-2deg)}
    .formhead{font:600 21px/1 futura-pt,Futura,sans-serif;letter-spacing:.2em;border-bottom:2px solid var(--ink);padding-bottom:20px;text-transform:uppercase}
    .field{height:58px;border-bottom:1px solid var(--line);margin-top:35px;font:400 26px/58px ff-real-text-pro,Arial,sans-serif;color:var(--grey)}
    .submit{display:inline-block;margin-top:38px;padding:18px 30px;border:2px solid var(--ink);font:600 27px/1 futura-pt,Futura,sans-serif;letter-spacing:.14em;text-transform:uppercase;position:relative}
    .submit.cross:after{content:"";position:absolute;left:-14px;right:-14px;top:50%;height:11px;background:linear-gradient(90deg,#daff00,#daff0080);transform:rotate(-5deg)}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:105px}
    .panel{border:2px solid currentColor;min-height:445px;padding:34px;position:relative}.panel .label{font:600 24px/1 futura-pt,Futura,sans-serif;letter-spacing:.16em}.panel strong{display:block;margin-top:75px;font:600 70px/1.05 futura-pt,Futura,sans-serif;text-transform:uppercase}.panel p{font:400 28px/1.3 ff-real-text-pro,Arial,sans-serif;margin-top:18px}
    .panel.right{background:var(--ink);color:var(--cream)}.dark .panel.right{background:var(--cream);color:var(--ink)}
    .stamp{position:absolute;right:12px;bottom:24px;width:120px;height:120px;border-radius:50%;border:7px double var(--ink);display:grid;place-items:center;font:600 28px futura-pt,Futura,sans-serif;transform:rotate(-15deg)}
    .timeline{display:flex;align-items:center;justify-content:space-between;margin-top:170px;border-top:3px solid currentColor;padding-top:35px;font:600 52px/1 futura-pt,Futura,sans-serif}.timeline .bar{width:120px;height:14px;background:linear-gradient(90deg,#daff00,#daff0030)}
    .chart{margin-top:70px;padding:30px 40px;background:#fffefc;color:var(--ink);border:2px solid var(--ink);width:790px;height:460px;position:relative;transform:rotate(-1deg)}
    .chart .title{font:600 24px futura-pt,Futura,sans-serif;letter-spacing:.12em;text-transform:uppercase}.chart svg{width:100%;height:320px;margin-top:20px}.chart .axis{display:flex;justify-content:space-between;font:500 20px futura-pt,Futura,sans-serif;letter-spacing:.1em}
    .list{margin-top:100px;border-top:2px solid currentColor}.list div{display:flex;justify-content:space-between;align-items:center;padding:35px 0;border-bottom:1px solid currentColor;font:600 54px/1 futura-pt,Futura,sans-serif;text-transform:uppercase}.list b{font-weight:300;font-size:25px;letter-spacing:.12em}
    .brandlockup{margin-top:100px}.brandlockup img{display:block;width:500px;height:auto;mix-blend-mode:multiply}.brandlockup small{display:block;font:500 35px/1.2 futura-pt,Futura,sans-serif;letter-spacing:.06em;margin-top:16px;text-transform:uppercase}.brandlockup~.note{max-width:540px}
    .reel.agents.scene-2 .orb{width:220px;height:220px;right:10px;bottom:-20px}
    .cover .hero{font-size:110px}.cover .sub{font-size:34px}.cover .orb{bottom:145px}
  </style>
</head>
<body><div id="reel"></div>
<script>
const q=new URLSearchParams(location.search), campaign=q.get('campaign')==='google'?'google':'agents', number=Number(q.get('scene')||0);
const dotgrid='<div class="dotgrid">'+Array.from({length:24},()=>'<i></i>').join('')+'</div>';
const orb=(yellow=false)=>`<div class="orb ${yellow?'yellow':''}"></div>`;
const chart=`<div class="chart"><div class="title">Search performance / Web</div><svg viewBox="0 0 700 300" aria-hidden="true"><path d="M0 270H700M0 180H700M0 90H700" stroke="#bbb8af" stroke-width="2" stroke-dasharray="7 9"/><path d="M5 70 C120 85 140 55 230 110 S365 145 440 155 S540 210 695 225" fill="none" stroke="#35332f" stroke-width="12"/><circle cx="440" cy="155" r="15" fill="#daff00" stroke="#35332f" stroke-width="5"/></svg><div class="axis"><span>SEP 24</span><span>OCT 8</span></div></div>`;
const scenes={
 agents:[
  {dark:false,body:`<h1 class="hero">THE AI WAS<br>TOLD TO<br><span class="marker">STOP.</span></h1>${orb()}<p class="note">Before it submitted a real form.</p>`},
  {dark:true,body:`<h1 class="hero tight">IT SUBMITTED<br>THE FORM<br>ANYWAY.</h1><div class="form"><div class="formhead">Form preview / evaluation</div><div class="field">Name</div><div class="field">Details</div><div class="submit cross">Submit</div></div>`},
  {dark:false,body:`<div class="eyebrow">What actually happened</div><div class="rule"></div><h1 class="hero tight">IN AN<br>ANTHROPIC<br>EVALUATION.</h1><p class="sub">Reported October 9, 2026. Known impact: minimal.</p>${orb()}`},
  {dark:false,body:`<div class="eyebrow">The distinction</div><h1 class="hero" style="margin-top:90px">A PROMPT<br>IS A <span class="marker">REQUEST.</span></h1><p class="sub">“Don't press submit” still leaves the button available.</p>${dotgrid}`},
  {dark:true,body:`<div class="eyebrow">The distinction / 02</div><h1 class="hero" style="margin-top:90px">A PERMISSION<br>IS A <span class="marker">LIMIT.</span></h1><p class="sub">No submit tool. No accidental submission.</p>${orb(true)}`},
  {dark:false,body:`<h1 class="hero tight">DRAFT?<br>GO AHEAD.</h1><div class="split"><div class="panel"><div class="label">01 / AGENT</div><strong>PREPARE</strong><p>Work stays editable.</p></div><div class="panel right"><div class="label">02 / PERSON</div><strong>APPROVE</strong><p>See the exact action.</p></div></div>`},
  {dark:false,body:`<h1 class="hero tight">SMART AGENTS<br>NEED HARD<br><span class="marker">BOUNDARIES.</span></h1><p class="sub">Read the full article for the approval checklist.</p>${dotgrid}`},
  {dark:false,body:`<div class="eyebrow">The Dot Creative Agency</div><div class="brandlockup"><img src="/brand-kit/logo.png" alt="The Dot Creative Agency"><small>ON POINT. BY DESIGN.</small></div><p class="note">Full article on the blog · link in bio after publication.</p>${dotgrid}`}
 ],
 google:[
  {dark:false,body:`<h1 class="hero tight">GOOGLE<br>UPDATED ITS<br>SPAM SYSTEM.</h1>${orb()}<p class="note">Your chart moved. Now what?</p>`},
  {dark:true,body:`<h1 class="hero tight">DON'T<br>REWRITE<br>YOUR SITE.<br><span class="marker">YET.</span></h1><p class="sub">First, find out what changed.</p>`},
  {dark:false,body:`<div class="eyebrow">September 2026 spam update</div><h1 class="hero tight" style="margin-top:105px">THE ROLLOUT<br>IS OVER.</h1><div class="timeline"><span>SEP 24</span><span class="bar"></span><span>OCT 8</span></div><p class="sub">Global · all languages</p>`},
  {dark:false,body:`<h1 class="hero tight">DID YOUR<br>SEARCH<br>VISIBILITY<br>FALL?</h1>${chart}`},
  {dark:true,body:`<h1 class="hero large">CHECK<br>THE DATA<br><span class="marker">FIRST.</span></h1><p class="sub">Open Search Console. Compare periods.</p>${orb(true)}`},
  {dark:false,body:`<h1 class="hero tight">FIND THE<br>CHANGE.</h1><div class="list"><div><span>Impressions</span><b>01</b></div><div><span>Clicks</span><b>02</b></div><div><span>Pages</span><b>03</b></div><div><span>Queries</span><b>04</b></div></div>`},
  {dark:false,body:`<h1 class="hero tight">A DROP<br>ISN'T A<br><span class="marker">DIAGNOSIS.</span></h1><p class="sub">Check technical issues and manual actions too.</p>${dotgrid}`},
  {dark:false,body:`<div class="eyebrow">The Dot Creative Agency</div><div class="brandlockup"><img src="/brand-kit/logo.png" alt="The Dot Creative Agency"><small>ON POINT. BY DESIGN.</small></div><p class="note">Full Search Console walkthrough on the blog · link in bio after publication.</p>${dotgrid}`}
 ]
};
if(!Number.isInteger(number)||number<0||number>7)throw new Error('Scene must be 0–7');
const entry=scenes[campaign][number];
document.getElementById('reel').innerHTML=`<div class="reel ${campaign} scene-${number} ${entry.dark?'dark':''} ${number===0?'cover':''}"><div class="safe"><header class="mast"><span>The Dot</span><span>${campaign==='agents'?'Business systems':'Search notes'}</span><span>${String(number+1).padStart(2,'0')}</span></header><main class="main">${entry.body}</main><footer class="meta"><span>${campaign==='agents'?'Instructions ≠ permissions':'Check before you change'}</span><span>@thedotcreativeagency</span></footer></div></div>`;
</script></body></html>
