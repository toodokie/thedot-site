<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://use.typekit.net/gac6jnd.css">
  <title>The Dot · October article covers</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden}
    body{font-family:futura-pt,Futura,sans-serif}
    .cover{position:relative;width:1200px;height:630px;overflow:hidden}
    .cover:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.62' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath filter='url(%23n)' opacity='.26' d='M0 0h240v240H0z'/%3E%3C/svg%3E")}
    .mast{position:absolute;left:70px;right:70px;top:51px;display:flex;justify-content:space-between;padding-top:13px;border-top:3px solid currentColor;font-size:20px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    .foot{position:absolute;left:70px;right:70px;bottom:45px;display:flex;justify-content:space-between;padding-top:13px;border-top:1px solid currentColor;font-size:18px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    h1,p{margin:0}
    .ai{background:#faf9f6;color:#35332f}
    .ai h1{position:absolute;left:70px;top:180px;font-size:103px;line-height:.91;letter-spacing:-.055em;text-transform:uppercase;max-width:750px;z-index:2}
    .ai h1 span{display:block}
    .ai h1 em{font-style:normal;position:relative;z-index:1}
    .ai h1 em:after{content:"";position:absolute;left:0;right:0;bottom:3px;height:13px;background:#daff00;z-index:-1;transform:rotate(-1deg)}
    .ai .sub{position:absolute;left:73px;top:459px;font:400 28px/1.18 ff-real-text-pro,Arial,sans-serif;max-width:610px}
    .ai .orb{position:absolute;right:42px;top:195px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 2%,#c5c4be 34%,#55534d 68%,#faf9f6 76%);filter:grayscale(1);opacity:.82;box-shadow:inset -8px -9px 25px #35332f44}
    .ai .dots{position:absolute;right:75px;bottom:116px;display:grid;grid-template-columns:repeat(6,14px);gap:13px;opacity:.7}
    .ai .dots i{width:14px;height:14px;border:1px solid #35332f;border-radius:50%}
    .ai .dots i:nth-child(4n){background:#35332f}
    .google{background:#35332f;color:#faf9f6}
    .google .mast{border-top:7px solid #daff00}
    .google .flag{position:absolute;top:153px;left:70px;background:#daff00;color:#35332f;padding:8px 13px;font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .google h1{position:absolute;left:70px;top:220px;font-size:85px;line-height:.96;letter-spacing:-.055em;text-transform:uppercase;max-width:690px}
    .google h1 span{display:block}
    .google h1 .yellow{color:#daff00}
    .google .chart{position:absolute;right:70px;top:214px;width:390px;height:267px;border:2px solid #faf9f6;background:repeating-linear-gradient(90deg,transparent 0 75px,#faf9f621 76px 77px),repeating-linear-gradient(0deg,transparent 0 64px,#faf9f621 65px 66px)}
    .google .chart svg{position:absolute;inset:0;width:100%;height:100%}
    .google .chart .label{position:absolute;left:17px;top:15px;font-size:16px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
    .google .sub{position:absolute;left:72px;bottom:95px;font:400 27px/1.2 ff-real-text-pro,Arial,sans-serif}
    .google .foot{border-color:#faf9f6}
  </style>
</head>
<body>
  <div id="cover"></div>
  <script>
    const campaign=new URLSearchParams(location.search).get('campaign');
    const dots='<div class="dots">'+Array.from({length:24},()=>'<i></i>').join('')+'</div>';
    const ai='<div class="cover ai"><header class="mast"><span>The Dot Creative Agency</span><span>Business systems / 01</span></header><h1><span>AI AGENTS</span><span>AT <em>WORK.</em></span></h1><p class="sub">Four boundaries before you connect the tools.</p><div class="orb"></div>'+dots+'<footer class="foot"><span>Instructions ≠ permissions</span><span>On point. By design.</span></footer></div>';
    const google='<div class="cover google"><header class="mast"><span>The Dot Creative Agency</span><span>Search notes / 02</span></header><div class="flag">Search bulletin</div><h1><span>GOOGLE</span><span>CHANGED ITS</span><span class="yellow">SPAM SYSTEM.</span></h1><div class="chart"><span class="label">Search visibility</span><svg viewBox="0 0 390 267" aria-hidden="true"><polyline points="0,75 67,84 133,62 195,94 245,107 299,175 390,209" fill="none" stroke="#faf9f6" stroke-width="7"/><circle cx="299" cy="175" r="10" fill="#daff00"/></svg></div><p class="sub">What changed for your traffic?</p><footer class="foot"><span>A drop is not a diagnosis</span><span>On point. By design.</span></footer></div>';
    document.getElementById('cover').innerHTML=campaign==='google'?google:ai;
  </script>
</body>
</html>
