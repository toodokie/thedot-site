<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#faf9f6;}
  .cover{
    position:relative; width:1200px; height:630px; background:#faf9f6; overflow:hidden;
    font-family:"Futura","Avenir Next","Helvetica Neue",Arial,sans-serif; color:#35332f;
  }
  .glow{position:absolute; inset:0;
    background:radial-gradient(circle farthest-corner at 110% -12%, #daff00d9, #eefb9d99 28%, rgba(250,249,246,0) 50%);}
  .dots{position:absolute; right:70px; bottom:58px; display:grid; grid-template-columns:repeat(4,32px); gap:16px;}
  .dots i{width:32px;height:32px;border-radius:50%;border:1.5px solid #35332f;display:block;}
  .dots i.f{background:radial-gradient(circle at 34% 30%,#ffffff,#daff00); border-color:rgba(53,51,47,.18);}
  .dots i.k{background:#35332f;}
  .content{position:absolute; left:78px; top:74px; right:78px;}
  .eyebrow{display:flex; align-items:center; gap:13px; font-size:19px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:#7a776f;}
  .eyebrow .d{width:11px;height:11px;border-radius:50%; background:radial-gradient(circle at 34% 30%,#fff,#daff00); border:1px solid #35332f;}
  h1{margin-top:104px; font-size:94px; font-weight:300; line-height:1.0; letter-spacing:-.02em; max-width:940px;}
  h1 .hl{background-image:linear-gradient(180deg, rgba(218,255,0,.5), #daff00); background-repeat:no-repeat; background-position:0 90%; background-size:100% .32em; padding:0 .02em;}
  .sub{margin-top:34px; font-size:28px; font-weight:400; color:#47453f; letter-spacing:.004em; max-width:760px;}
  .tick{position:absolute; left:78px; bottom:116px; width:520px; height:13px;
    background:repeating-linear-gradient(90deg, #35332f 0 1.5px, transparent 1.5px 8px);}
  .foot{position:absolute; left:78px; bottom:62px; font-size:20px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:#35332f;}
</style></head>
<body>
  <div class="cover">
    <div class="glow"></div>
    <div class="dots">
      <i class="k"></i><i></i><i class="f"></i><i></i>
      <i></i><i class="f"></i><i></i><i class="k"></i>
    </div>
    <div class="content">
      <div class="eyebrow"><span class="d"></span>The Dot Creative &nbsp;·&nbsp; Marketing notes</div>
      <h1>Can <span class="hl">AI</span> find your business?</h1>
      <div class="sub">The new kind of search you can’t ignore, and how to check where you stand.</div>
    </div>
    <div class="tick"></div>
    <div class="foot">thedotcreative.co</div>
  </div>
</body></html>
